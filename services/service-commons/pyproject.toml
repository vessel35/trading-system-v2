[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "service-commons"
version = "0.1.0"
description = "Shared infrastructure utilities for long-running trading services."
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
    "mypy>=1.14",
    "pytest>=8.3",
    "ruff>=0.9",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["service_commons*"]

[tool.setuptools.package-data]
service_commons = ["py.typed"]

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
    "--strict-config",
    "--strict-markers",
    "-m",
    "not integration",
]
markers = [
    "integration: uses the local development PostgreSQL instance",
    "real_data_long: runs the long-window real-data regression tier",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["service_commons", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
files = ["service_commons", "tests"]
python_version = "3.12"
strict = true
warn_unreachable = true
