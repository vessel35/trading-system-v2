[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "core-lib"
version = "0.2.0"
description = "Shared domain standards for backtest, paper, and live trading modes."
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
    "mypy>=1.14",
    "pytest>=8.3",
    "ruff>=0.9",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["core_lib*"]

[tool.setuptools.package-data]
core_lib = ["py.typed"]

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
    "--strict-config",
    "--strict-markers",
    "-m",
    "not integration",
]
markers = [
    "integration: uses the local development PostgreSQL instance",
    "real_data_long: runs the long-window real-data regression tier",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["core_lib", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# Generated capture. `scripts/capture_talib_pattern_signals.py` writes one line per CDL
# function so the file stays a readable table of functions instead of tens of thousands of
# lines of bare integers, and the block is fenced with `# fmt: off` for the same reason.
# Those lines are long by construction and no hand edit goes into them.
"tests/pattern_reference/talib_signals.py" = ["E501"]

[tool.mypy]
files = ["core_lib", "tests"]
python_version = "3.12"
strict = true
warn_unreachable = true
