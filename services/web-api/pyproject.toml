[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "web-api"
version = "0.1.0"
description = "Read-only FastAPI backend-for-frontend for the backtest research console."
requires-python = ">=3.12"
dependencies = [
    "core-lib==0.2.0",
    "fastapi>=0.115",
    "psycopg[binary]>=3.2",
    "pydantic>=2.10",
    "uvicorn[standard]>=0.34",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28",
    "mypy>=1.14",
    "pytest>=8.3",
    "ruff>=0.9",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["web_api*"]

[tool.setuptools.package-data]
web_api = ["py.typed"]

[tool.uv.sources]
core-lib = { path = "../core-lib", editable = true }

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
    "--strict-config",
    "--strict-markers",
]
markers = [
    "integration: uses the local development backtest PostgreSQL catalog",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["web_api", "tests", "scripts"]
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
files = ["web_api", "tests", "scripts"]
mypy_path = "$MYPY_CONFIG_FILE_DIR/../core-lib"
python_version = "3.12"
strict = true
warn_unreachable = true
