[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "signal-service"
version = "0.1.0"
description = "Finalized-candle signal generation driver for paper and live modes."
requires-python = ">=3.12"
dependencies = [
    "core-lib==0.2.0",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.14",
    "pytest>=8.3",
    "ruff>=0.9",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["signal_service*"]

[tool.setuptools.package-data]
signal_service = ["py.typed"]

[tool.uv.sources]
core-lib = { path = "../core-lib", editable = true }

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
    "--strict-config",
    "--strict-markers",
    "-m",
    "not integration",
]
markers = [
    "integration: uses an explicitly disposable local PostgreSQL schema",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["signal_service", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
files = ["signal_service", "tests"]
mypy_path = "$MYPY_CONFIG_FILE_DIR/../core-lib"
python_version = "3.12"
strict = true
warn_unreachable = true
