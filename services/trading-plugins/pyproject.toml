[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-plugins"
version = "0.1.0"
description = "Drop-in strategies and money-management policies discovered at import time."
requires-python = ">=3.12"
dependencies = [
    "core-lib==0.2.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.14",
    "pytest>=8.3",
    "ruff>=0.9",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["trading_plugins*"]

[tool.setuptools.package-data]
trading_plugins = ["py.typed"]

[tool.uv.sources]
core-lib = { path = "../core-lib", editable = true }

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
    "--strict-config",
    "--strict-markers",
]

[tool.ruff]
line-length = 100
src = ["trading_plugins", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
files = ["trading_plugins", "tests"]
mypy_path = "$MYPY_CONFIG_FILE_DIR/../core-lib"
python_version = "3.12"
strict = true
warn_unreachable = true
