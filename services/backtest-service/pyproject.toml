[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "backtest-service"
version = "0.1.0"
description = "Deterministic backtest orchestration service."
requires-python = ">=3.12"
dependencies = [
    "core-lib>=0.1.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2.10",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.14",
    "pytest>=8.3",
    "ruff>=0.9",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["backtest_service*"]

[tool.uv.sources]
core-lib = { path = "../core-lib", editable = true }

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
    "--strict-config",
    "--strict-markers",
    "-m",
    "not integration",
]
markers = [
    "integration: uses the local development PostgreSQL instance",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["backtest_service", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
files = ["backtest_service", "tests"]
python_version = "3.12"
strict = true
warn_unreachable = true
