name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/requirements-dev.txt

      - name: Set up Node.js for the OpenAPI drift guard
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install backend development dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -r services/requirements-dev.txt

      - name: Ruff lint
        run: .venv/bin/ruff check services

      - name: Ruff format check
        run: .venv/bin/ruff format --check services

      - name: Mypy service checks
        shell: bash
        run: |
          set -euo pipefail
          for service in \
            core-lib \
            trading-plugins \
            service-commons \
            collector \
            backtest-service \
            signal-service \
            wallet-service \
            web-api
          do
            (
              cd "services/${service}"
              "../../.venv/bin/mypy"
            )
          done

      # Integration/acceptance tiers intentionally remain opt-in until a
      # disposable PostgreSQL service-container job is added.
      #
      # The placeholders below are not credentials: no database runs here, and
      # nothing in this job reaches one. They exist because settings parsing
      # refuses to produce a configuration object without connection values, so
      # without them even the unit tests that only need the Evidence root fail
      # to construct settings. Tests that do open a connection get a refused
      # connection and skip themselves, which is the intended tiering.
      - name: Pytest without integration databases
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: ci-placeholder
          PGPASSWORD: ci-placeholder
        run: .venv/bin/pytest services -m "not integration"

      - name: Install frontend generator dependencies
        working-directory: apps/web
        run: npm ci

      - name: Guard generated OpenAPI client artifacts
        run: |
          npm --prefix apps/web run generate:api
          git diff --exit-code -- apps/web/src/api/

  frontend:
    name: Frontend (Node.js 22)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci

      - name: Typecheck
        working-directory: apps/web
        run: npm run typecheck

      - name: Build
        working-directory: apps/web
        run: npm run build

      - name: Test
        working-directory: apps/web
        run: npm test
